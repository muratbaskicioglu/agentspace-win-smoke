# Reset script (AS-4570): AgentSpace-Sifirla.cmd must also remove Antigravity (%LOCALAPPDATA%\agy)
# and OpenCode installed with npm, and must never touch the protected folders.
# See scripts/sifirla/sifirlaProbe.ps1 for the arms (install → dry run → control arm → new script).
#
# REPO RULE: no app source code and no unreleased build ever goes into this repo.
# This workflow downloads only the public engine installers (Antigravity install.ps1, npm opencode-ai,
# Node from nodejs.org with the sha256 the app pins) and runs the reset script given to testers.
#
# Security notes:
# - Manual trigger only. No push / pull_request / schedule triggers.
# - No secrets, no account. Fixed command line; inputs never reach a command.
# - Actions are pinned to full commit SHAs. Read-only token.
# - Standard runners only (free on a public repo).
name: sifirla

run-name: sifirla ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Shown in the run name only, so the caller can find its run (not used by any step)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sifirla
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: unit test (fake home folders, Windows PowerShell 5.1)
        shell: pwsh
        env:
          AS_PWSH: powershell
        run: |
          New-Item -ItemType Directory -Force sifirla | Out-Null
          node --test --test-reporter=spec scripts/sifirla/sifirla-win.test.cjs 2>&1 | Tee-Object -FilePath sifirla/unit.txt
          exit $LASTEXITCODE

      - name: probe (real engines, real profile of the throwaway runner)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          ./scripts/sifirla/sifirlaProbe.ps1 -Out sifirla
          exit $LASTEXITCODE

      - name: summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path sifirla/evidence.txt) { Get-Content sifirla/evidence.txt | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY }

      - name: upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sifirla-${{ matrix.runner }}-${{ github.run_id }}
          path: sifirla
          if-no-files-found: warn
          retention-days: 7
