# Bundle-seal check of a PUBLISHED AgentSpace release, on macOS 15 / 26 and Windows Server 2025.
#
# Question: does the app write into its own app bundle / install folder while it runs?
# On macOS that breaks the code signature seal ("a sealed resource is missing or invalid")
# and Gatekeeper may then refuse the app. On Windows a read-only (Program Files style)
# install must run without write errors.
#
# Every job starts on a fresh GitHub-hosted runner, downloads the release file from
# agentspace-releases and checks its sha256. Then:
#   macOS:   install -> seal (codesign, spctl, files newer than the signature, file list)
#            -> launch -> walk every page in the app window (scripts/sealNav.cjs) -> close
#            -> seal -> relaunch -> seal -> launch with the quarantine flag -> frames
#   Windows: install -> read-only copy (proved read-only) -> launch + walk + close from the
#            normal folder and twice from the read-only copy -> file diff + output search
#            for write errors. Arm "emulated-fix" runs the same with the Next.js disk cache
#            turned off in the installed copy (one config value), because no unreleased
#            build may come into this repo.
#
# expect = broken: the release is known to write into its bundle. Green = the check SAW it
#          (so the same check can be trusted to call a fixed release clean).
# expect = intact: green = nothing was written, codesign/spctl clean after the walk.
#
# REPO RULE: no app source code and no unreleased build ever goes into this repo.
# Security notes (same rules as clean-profile.yml):
# - Manual trigger only. No push / pull_request / schedule triggers.
# - No secrets, no account: the app stops at its sign-in screen. The walk does not click,
#   sign in or send anything; the camera/microphone pages are loaded with JavaScript off.
# - Inputs reach the shell only through env vars and are checked against strict patterns.
# - Release repo is fixed. Actions are pinned to full commit SHAs. Read-only token.
# - Standard runners only (free on a public repo). No -large / -xlarge labels.
# This workflow is NOT the release gate (that is clean-profile.yml).
name: bundle seal

run-name: bundle seal ${{ inputs.tag }} expect ${{ inputs.expect }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in agentspace-releases (e.g. v0.4.8)'
        required: true
        type: string
      version:
        description: 'Version in the file names (empty = tag without the leading v)'
        required: false
        type: string
        default: ''
      expect:
        description: 'broken = the release is known to write into its bundle (control) · intact = it must not'
        required: true
        type: choice
        options: [broken, intact]
      mac_arm64_sha256:
        description: 'sha256 of AgentSpace-<version>-arm64.dmg (empty = skip macOS)'
        required: false
        type: string
        default: ''
      win_sha256:
        description: 'sha256 of AgentSpace-Setup-<version>.exe (empty = skip Windows)'
        required: false
        type: string
        default: ''
      request_id:
        description: 'Shown in the run name only, so the caller can find its run (not used by any step)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: bundle-seal-${{ inputs.tag }}-${{ inputs.expect }}
  cancel-in-progress: false

jobs:
  mac:
    name: ${{ matrix.runner }}
    if: ${{ inputs.mac_arm64_sha256 != '' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: download dmg + check sha256
        env:
          SEAL_TAG: ${{ inputs.tag }}
          SEAL_VERSION: ${{ inputs.version }}
          SHA_ARM64: ${{ inputs.mac_arm64_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SEAL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag"; exit 1; }
          ver="${SEAL_VERSION:-${SEAL_TAG#v}}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          want="$(printf '%s' "$SHA_ARM64" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          asset="AgentSpace-${ver}-arm64.dmg"
          mkdir -p seal-input
          curl -fsSL --retry 3 -o "seal-input/$asset" \
            "https://github.com/muratbaskicioglu/agentspace-releases/releases/download/$SEAL_TAG/$asset"
          got="$(shasum -a 256 "seal-input/$asset" | cut -d' ' -f1)"
          echo "$got  $(stat -f %z "seal-input/$asset")  $asset"
          [[ "$got" == "$want" ]] || { echo "::error::sha256 mismatch: expected $want, got $got"; exit 1; }
          echo "| $asset | \`$got\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: install, seal, walk, close, seal, relaunch, quarantine
        env:
          SEAL_EXPECT: ${{ inputs.expect }}
        run: |
          [[ "$SEAL_EXPECT" == broken || "$SEAL_EXPECT" == intact ]] || { echo "::error::bad expect"; exit 1; }
          bash scripts/macSeal.sh "$(ls seal-input/*.dmg | head -1)" seal-mac "$SEAL_EXPECT"

      - name: upload evidence (frames, seal files, json)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seal-${{ matrix.runner }}-${{ github.run_id }}
          path: seal-mac
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: windows-2025 ${{ matrix.arm }}
    if: ${{ inputs.win_sha256 != '' }}
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(inputs.expect == 'broken' && '["published","emulated-fix"]' || '["published"]') }}
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: download installer + check sha256
        env:
          SEAL_TAG: ${{ inputs.tag }}
          SEAL_VERSION: ${{ inputs.version }}
          SEAL_SHA256: ${{ inputs.win_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SEAL_TAG -cnotmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { Write-Host "::error::bad tag"; exit 1 }
          $ver = if ($env:SEAL_VERSION) { $env:SEAL_VERSION } else { $env:SEAL_TAG.Substring(1) }
          if ($ver -cnotmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { Write-Host "::error::bad version"; exit 1 }
          $want = $env:SEAL_SHA256.Trim().ToLower()
          if ($want -cnotmatch '^[0-9a-f]{64}$') { Write-Host "::error::bad sha256"; exit 1 }
          $asset = "AgentSpace-Setup-$ver.exe"
          $url = "https://github.com/muratbaskicioglu/agentspace-releases/releases/download/$($env:SEAL_TAG)/$asset"
          New-Item -ItemType Directory -Force -Path seal-input | Out-Null
          $dst = Join-Path 'seal-input' $asset
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
          $got = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$got  $((Get-Item $dst).Length)  $asset"
          if ($got -ne $want) { Write-Host "::error::sha256 mismatch: expected $want, got $got"; exit 1 }
          "| $asset | ``$got`` |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: install, read-only copy, launch + walk + close (3x), diff, output search
        env:
          SEAL_ARM: ${{ matrix.arm }}
          SEAL_EXPECT: ${{ inputs.expect }}
        run: |
          if ($env:SEAL_ARM -cnotmatch '^(published|emulated-fix)$' -or $env:SEAL_EXPECT -cnotmatch '^(broken|intact)$') { Write-Host "::error::bad arm/expect"; exit 1 }
          $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/winSeal.ps1), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { Write-Host "::error::winSeal.ps1 parse: $_" }; exit 2 }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/winSeal.ps1 -Dist seal-input -OutDir seal-win -Arm $env:SEAL_ARM -Expect $env:SEAL_EXPECT
          exit $LASTEXITCODE

      - name: upload evidence (frames, json, logs)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seal-windows-2025-${{ matrix.arm }}-${{ github.run_id }}
          path: seal-win
          if-no-files-found: warn
          retention-days: 7
