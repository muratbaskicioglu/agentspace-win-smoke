# Clean-profile first run of a PUBLISHED AgentSpace Linux AppImage, on Ubuntu 22.04,
# 24.04 and 26.04 (x64) and Ubuntu 24.04 / 26.04 (arm64).
#
# Every job starts on a fresh GitHub-hosted runner (nothing of AgentSpace on it), downloads
# the AppImage from agentspace-releases, checks its sha256, then:
#   copy to ~/Applications + chmod +x -> first launch up to the sign-in screen -> close
#   -> nothing left 60 s later -> delete the file
# with a frame of the app window. It records what a user on that Ubuntu meets first
# (FUSE 2, the user-namespace sandbox) and runs the installed app's own modules
# (scripts/appProbe.cjs).
#
# REPO RULE: no app source code and no unreleased build ever goes into this repo.
# Only a PUBLISHED AppImage (downloaded, sha256 checked) + test scripts.
#
# Security notes (same rules as clean-profile.yml):
# - Manual trigger only. No push / pull_request / schedule triggers.
# - No secrets, no account: the app stops at its sign-in screen.
# - Inputs reach the shell only through env vars and are checked against strict patterns.
# - Release repo is fixed. Actions are pinned to full commit SHAs. Read-only token.
# - Standard runners only (free on a public repo). No -large / -xlarge labels.
name: linux clean profile first run

run-name: linux clean profile ${{ inputs.tag }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in agentspace-releases (e.g. v0.4.4)'
        required: true
        type: string
      version:
        description: 'Version in the file names (empty = tag without the leading v)'
        required: false
        type: string
        default: ''
      x64_sha256:
        description: 'sha256 of AgentSpace-<version>-x86_64.AppImage'
        required: true
        type: string
      arm64_sha256:
        description: 'sha256 of AgentSpace-<version>-arm64.AppImage (empty = skip arm64)'
        required: false
        type: string
        default: ''
      request_id:
        description: 'Shown in the run name only, so the caller can find its run (not used by any step)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-clean-profile-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 runners only when the release has an arm64 AppImage.
        runner: ${{ fromJSON(inputs.arm64_sha256 != '' && '["ubuntu-22.04","ubuntu-24.04","ubuntu-26.04","ubuntu-24.04-arm","ubuntu-26.04-arm"]' || '["ubuntu-22.04","ubuntu-24.04","ubuntu-26.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: download AppImage + check sha256
        env:
          SMOKE_TAG: ${{ inputs.tag }}
          SMOKE_VERSION: ${{ inputs.version }}
          SMOKE_RUNNER: ${{ matrix.runner }}
          SHA_X64: ${{ inputs.x64_sha256 }}
          SHA_ARM64: ${{ inputs.arm64_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag"; exit 1; }
          ver="${SMOKE_VERSION:-${SMOKE_TAG#v}}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          case "$SMOKE_RUNNER" in *-arm) arch=arm64; want="$SHA_ARM64" ;; *) arch=x86_64; want="$SHA_X64" ;; esac
          want="$(printf '%s' "$want" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          asset="AgentSpace-${ver}-${arch}.AppImage"
          mkdir -p smoke-input
          curl -fsSL --retry 3 -o "smoke-input/$asset" \
            "https://github.com/muratbaskicioglu/agentspace-releases/releases/download/$SMOKE_TAG/$asset"
          got="$(sha256sum "smoke-input/$asset" | cut -d' ' -f1)"
          echo "$got  $(stat -c %s "smoke-input/$asset")  $asset"
          [[ "$got" == "$want" ]] || { echo "::error::sha256 mismatch: expected $want, got $got"; exit 1; }
          echo "| $asset | \`$got\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: install, first launch, close, delete
        run: bash scripts/linuxSmoke.sh "$(ls smoke-input/*.AppImage | head -1)" clean-profile-linux

      - name: upload evidence (frames, json, app log)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-clean-profile-${{ matrix.runner }}-${{ github.run_id }}
          path: clean-profile-linux
          if-no-files-found: warn
          retention-days: 7
