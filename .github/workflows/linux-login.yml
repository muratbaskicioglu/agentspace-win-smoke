# Linux sign-in of a PUBLISHED AgentSpace AppImage on Ubuntu 24.04 (ubuntu-latest), arm by
# arm: GNOME with an unlocked keyring, no declared desktop, no declared desktop with
# --password-store=gnome-libsecret, GNOME without any keyring, KDE without KWallet.
# In every arm a real mouse click on "Sign in", the system browser hand-off, a real
# browser start from the app's environment, and an agentspace:// return through xdg-open.
# Then the engine CLIs' (claude, codex) sign-in flow is started with the app's own module.
#
# REPO RULE: no app source code and no unreleased build ever goes into this repo.
# Only a PUBLISHED AppImage (downloaded, sha256 checked) + test scripts.
#
# Security notes (same rules as linux-clean-profile.yml):
# - Manual trigger only. No push / pull_request / schedule triggers.
# - No secrets, no account. The browser is a stand-in that never loads the address; the
#   return carries a fake code with a wrong state, rejected by the app before any network call.
# - Inputs reach the shell only through env vars and are checked against strict patterns.
# - Release repo is fixed. Actions are pinned to full commit SHAs. Read-only token.
# - Standard runner only (free on a public repo).
name: linux sign-in

run-name: linux sign-in ${{ inputs.tag }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag in agentspace-releases (e.g. v0.4.4)'
        required: true
        type: string
      version:
        description: 'Version in the file names (empty = tag without the leading v)'
        required: false
        type: string
        default: ''
      x64_sha256:
        description: 'sha256 of AgentSpace-<version>-x86_64.AppImage'
        required: true
        type: string
      request_id:
        description: 'Shown in the run name only, so the caller can find its run (not used by any step)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-login-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  login:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: download AppImage + check sha256
        env:
          SMOKE_TAG: ${{ inputs.tag }}
          SMOKE_VERSION: ${{ inputs.version }}
          SHA_X64: ${{ inputs.x64_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag"; exit 1; }
          ver="${SMOKE_VERSION:-${SMOKE_TAG#v}}"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          want="$(printf '%s' "$SHA_X64" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          asset="AgentSpace-${ver}-x86_64.AppImage"
          mkdir -p smoke-input
          curl -fsSL --retry 3 -o "smoke-input/$asset" \
            "https://github.com/muratbaskicioglu/agentspace-releases/releases/download/$SMOKE_TAG/$asset"
          got="$(sha256sum "smoke-input/$asset" | cut -d' ' -f1)"
          echo "$got  $(stat -c %s "smoke-input/$asset")  $asset"
          [[ "$got" == "$want" ]] || { echo "::error::sha256 mismatch: expected $want, got $got"; exit 1; }

      - name: sign-in arms + engine CLIs
        run: bash scripts/linuxLogin.sh "$(ls smoke-input/*.AppImage | head -1)" linux-login

      - name: upload evidence (frames, json, app stdout)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-login-${{ github.run_id }}
          path: linux-login
          if-no-files-found: warn
          retention-days: 7
