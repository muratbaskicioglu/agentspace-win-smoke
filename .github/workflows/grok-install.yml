# Grok Build CLI on Windows: the vendor PowerShell installer, run the way AgentSpace runs it,
# then the sign-in up to the login screen (never completed). See scripts/grokInstallProbe.cjs.
#
# REPO RULE: no app source code and no unreleased build ever goes into this repo.
# This workflow downloads only the public Grok Build installer script and runs a test script.
#
# Security notes:
# - Manual trigger only. No push / pull_request / schedule triggers.
# - No secrets, no account, no API key: XAI_API_KEY is removed, sign-in is time-boxed and never
#   approved; every arm uses a throwaway user home under RUNNER_TEMP. Sign-in URLs are masked.
# - Actions are pinned to full commit SHAs. Read-only token.
# - Standard runners only (free on a public repo).
name: grok install

run-name: grok install ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Shown in the run name only, so the caller can find its run (not used by any step)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: grok-install
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: probe
        shell: pwsh
        run: |
          node scripts/grokInstallProbe.cjs --out grok-install --version 1.0.70
          exit $LASTEXITCODE

      - name: summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path grok-install/evidence.txt) { Get-Content grok-install/evidence.txt | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY }

      - name: upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-install-${{ matrix.runner }}-${{ github.run_id }}
          path: grok-install
          if-no-files-found: warn
          retention-days: 7
